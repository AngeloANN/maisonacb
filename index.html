<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison ACB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    /* The silver-white of the logo disc */
    --silver-dark: #8a909d;
    --silver: #b9bec8;
    --silver-light: #e6e8ec;
    --text: #1b1b1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #1a0204; color: #fff; font-family: Inter, system-ui, sans-serif; overflow: hidden; }

  /* Spinning logo video, full screen, plays once */
  .bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .buttons { z-index: 2; }

  /* Buttons */
  .buttons {
    position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(4, auto); gap: 18px;
  }
  @media (max-width: 900px) { .buttons { grid-template-columns: repeat(2, auto); } }
  @media (max-width: 440px) { .buttons { grid-template-columns: 1fr; bottom: 6vh; } }

  .blob-btn {
    position: relative; display: grid; place-items: center;
    width: 250px; height: 72px; padding: 0 28px;
    color: var(--text); text-decoration: none; font-weight: 700; font-size: 16px; letter-spacing: .2px;
    /* hidden until revealed */
    opacity: 0; transform: translateY(18px) scale(.94);
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1.3);
  }
  .blob-btn.show { opacity: 1; transform: none; }
  /* Soft white halo behind each button, gently breathing */
  .blob-btn::before {
    content: ""; position: absolute; inset: -34px -44px; z-index: -1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,.18) 55%, transparent);
    filter: blur(10px); animation: halo 4s ease-in-out infinite; pointer-events: none;
  }
  .blob-btn:nth-child(2)::before { animation-delay: -1s; }
  .blob-btn:nth-child(3)::before { animation-delay: -2s; }
  .blob-btn:nth-child(4)::before { animation-delay: -3s; }
  @keyframes halo { 0%, 100% { opacity: .65; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
  .blob-btn:hover::before { background: radial-gradient(closest-side, rgba(255,150,90,.35), rgba(255,120,70,.12) 55%, transparent); }
  .blob-btn { isolation: isolate; }
  .blob-btn span { position: relative; z-index: 1; text-align: center; }
  .blob-btn svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
                  filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); transition: transform .25s ease; }
  /* 1st and 3rd buttons: the shape is mirrored, so the dent sits on the right (text stays normal) */
  .blob-btn.flip svg { transform: scaleX(-1); }
  /* Hover: the orange layer fades in over the silver, and the text turns white */
  .blob-btn .hot { opacity: 0; transition: opacity .45s ease; }
  .blob-btn span { transition: color .45s ease; }
  .blob-btn:hover .hot, .blob-btn:focus-visible .hot { opacity: 1; }
  .blob-btn:hover span, .blob-btn:focus-visible span { color: #fff; }
  .blob-btn:hover svg { transform: scale(1.04); }
  .blob-btn.flip:hover svg { transform: scaleX(-1) scale(1.04); }
  .blob-btn:focus-visible { outline: 2px solid var(--silver-light); outline-offset: 6px; border-radius: 40px; }

  @media (prefers-reduced-motion: reduce) {
    .blob-btn { transition: none; }
    .blob-btn::before { animation: none; }
  }
</style>
</head>
<body>

<!-- Plays once, slows down smoothly at the end and stays paused on the last frame -->
<video class="bg" id="intro" src="spin.mp4" poster="spin-poster.jpg" autoplay muted playsinline aria-hidden="true"></video>

<!-- The button shape, defined once and reused by all four buttons -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="var(--silver)"/>
      <stop offset=".55" stop-color="var(--silver-light)"/>
      <stop offset="1" stop-color="#f4f5f7"/>
    </linearGradient>
    <linearGradient id="silverBack" x1="0" x2="1">
      <stop offset="0" stop-color="var(--silver-dark)"/>
      <stop offset="1" stop-color="#a7adb8"/>
    </linearGradient>
    <!-- Hover colours: the orange of the dots in the background -->
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0" stop-color="#e14628"/>
      <stop offset="1" stop-color="#ff9a5a"/>
    </linearGradient>
    <linearGradient id="orangeBack" x1="0" x2="1">
      <stop offset="0" stop-color="#a8261a"/>
      <stop offset="1" stop-color="#d0472c"/>
    </linearGradient>
    <!-- darker layer peeking out at the top-left: the "dent" -->
    <path id="blobBack" d="M14 22 C18 6 44 0 90 1 C130 2 168 6 196 13 C160 13 110 15 70 18 C44 20 26 24 14 22Z"/>
    <!-- main pill, with a slightly wavy top edge -->
    <path id="blobFront" d="M36 12 C80 18 130 16 180 12 C215 9 242 14 248 34 C254 56 236 70 206 70 L48 70 C18 70 2 56 4 38 C6 20 18 10 36 12Z"/>
  </defs>
</svg>

<nav class="buttons" aria-label="Main">
  <a class="blob-btn flip" href="collection.html">
    <svg viewBox="0 0 252 72" preserveAspectRatio="none" aria-hidden="true"><use href="#blobBack" fill="url(#silverBack)"/><use href="#blobFront" fill="url(#silver)"/><g class="hot"><use href="#blobBack" fill="url(#orangeBack)"/><use href="#blobFront" fill="url(#orange)"/></g></svg>
    <span>Explore Our Collections</span>
  </a>
  <a class="blob-btn" href="#designs">
    <svg viewBox="0 0 252 72" preserveAspectRatio="none" aria-hidden="true"><use href="#blobBack" fill="url(#silverBack)"/><use href="#blobFront" fill="url(#silver)"/><g class="hot"><use href="#blobBack" fill="url(#orangeBack)"/><use href="#blobFront" fill="url(#orange)"/></g></svg>
    <span>Explore Our Designs</span>
  </a>
  <a class="blob-btn flip" href="#contact">
    <svg viewBox="0 0 252 72" preserveAspectRatio="none" aria-hidden="true"><use href="#blobBack" fill="url(#silverBack)"/><use href="#blobFront" fill="url(#silver)"/><g class="hot"><use href="#blobBack" fill="url(#orangeBack)"/><use href="#blobFront" fill="url(#orange)"/></g></svg>
    <span>Contact Us</span>
  </a>
  <a class="blob-btn" href="#about">
    <svg viewBox="0 0 252 72" preserveAspectRatio="none" aria-hidden="true"><use href="#blobBack" fill="url(#silverBack)"/><use href="#blobFront" fill="url(#silver)"/><g class="hot"><use href="#blobBack" fill="url(#orangeBack)"/><use href="#blobFront" fill="url(#orange)"/></g></svg>
    <span>About Us</span>
  </a>
</nav>

<script>
  // Once everything (video included) has loaded, wait 2 s, then reveal the buttons one at a time.
  const DELAY = 2000;   // wait after the page has loaded
  const STAGGER = 250;  // time between each button
  // ---- Video: spin down smoothly, then freeze just before the end ----
  // During the last SLOW_DOWN seconds, the speed eases from 1 down to 0.1,
  // so the disc decelerates like it's coming to rest. Then it pauses and stays there.
  const intro = document.getElementById("intro");
  const SLOW_DOWN = 2.5;   // seconds of deceleration at the end
  const STOP_BEFORE = 0.05; // pause this close to the end (never reaches "ended")
  function tick() {
    const left = intro.duration - intro.currentTime;
    if (left <= STOP_BEFORE) { intro.pause(); return; }
    if (left < SLOW_DOWN) {
      const t = left / SLOW_DOWN;               // 1 → 0 as we approach the end
      intro.playbackRate = Math.max(0.1, t * t * (3 - 2 * t)); // smooth ease
    }
    requestAnimationFrame(tick);
  }
  intro.addEventListener("play", () => requestAnimationFrame(tick), { once: true });
  // Reduced motion: jump straight to the last frame.
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    intro.removeAttribute("autoplay"); intro.pause();
    intro.addEventListener("loadedmetadata", () => { intro.currentTime = intro.duration - STOP_BEFORE; });
  }

  window.addEventListener("load", () => {
    document.querySelectorAll(".blob-btn").forEach((btn, i) => {
      setTimeout(() => btn.classList.add("show"), DELAY + i * STAGGER);
    });
  });
</script>
</body>
</html>
