<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maison ACB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        .wardrobe { animation: rise 1.6s cubic-bezier(.16,1,.3,1) both; }
        @keyframes rise { from { transform: translateY(60vh); } to { transform: none; } }
        .engraved {
            color: #141414;
            text-shadow: 0 1px 0 rgba(255,255,255,.12), 0 -1px 0 rgba(0,0,0,.8);
            opacity: 0; animation: fade 1s 1.6s forwards;   /* appears once the wardrobe has stopped */
        }
        .hint { opacity: 0; animation: fade .6s 2.6s forwards, blink 1.2s 3.2s infinite; }
        @keyframes fade { to { opacity: 1; } }
        @keyframes blink { 50% { opacity: .2; } }

        .door { position: absolute; top: 0; width: 50%; height: 100%;
            transition: transform 1.2s cubic-bezier(.65,0,.35,1); }
        .door.left  { left: 0;  background: url(porte-gauche.jpg) center/cover; }
        .door.right { right: 0; background: url(porte-droite.png) center/cover; }
        .open .door.left  { transform: translateX(-100%); }
        .open .door.right { transform: translateX(100%); }
        .open .engraved, .open .hint { opacity: 0; transition: opacity .3s; }


    </style>
</head>
<body>
<section class="wardrobe" id="wardrobe">
    <div class="inside">        <!-- the inside + clothes grid -->
        <div class="racks" id="racks"></div>
    </div>
    <div class="door left"></div>
    <div class="door right"></div>
    <h1 class="engraved">CLOTHES</h1>
    <p class="hint">Click to open</p>
</section>

<script src="clothes.js"></script>
</body>
</html>
